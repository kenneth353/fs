<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>improving · maangas</title>
    <style>
        /* RESET & GLOBAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0d15;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* MAANGAS GLOW BACKGROUND */
        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, #1e2a5a 0%, #0a0c14 70%);
            z-index: 0;
        }

        /* ANIMATED SCANLINES / MOVING GRID */
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            animation: gridShift 8s linear infinite;
            pointer-events: none;
        }

        @keyframes gridShift {
            0% { background-position: 0 0; }
            100% { background-position: 40px 40px; }
        }

        /* MAIN CARD – GLASSMORPHISM + HARD EDGE */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 15, 30, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(0, 255, 255, 0.5);
            border-radius: 32px;
            padding: 3.5rem 4.5rem;
            box-shadow: 
                0 0 30px rgba(0, 255, 255, 0.3),
                0 0 80px rgba(0, 180, 255, 0.2),
                inset 0 0 30px rgba(0, 255, 255, 0.1);
            animation: cardPulse 3s ease-in-out infinite alternate;
            transition: box-shadow 0.3s;
        }

        @keyframes cardPulse {
            0% {
                box-shadow: 
                    0 0 25px rgba(0, 255, 255, 0.3),
                    0 0 60px rgba(0, 180, 255, 0.15),
                    inset 0 0 20px rgba(0, 255, 255, 0.05);
                border-color: rgba(0, 255, 255, 0.4);
            }
            100% {
                box-shadow: 
                    0 0 45px rgba(0, 255, 255, 0.6),
                    0 0 100px rgba(0, 200, 255, 0.3),
                    inset 0 0 40px rgba(0, 255, 255, 0.2);
                border-color: rgba(0, 255, 255, 0.9);
            }
        }

        /* TEXT CONTAINER */
        .text-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            text-align: center;
        }

        /* MAIN LINE – "i improving this site" */
        .line1 {
            font-size: clamp(2rem, 8vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px #0ff,
                0 0 20px #0ff,
                0 0 40px #0af,
                0 0 80px #0af;
            animation: flickerGlow 2.2s infinite alternate;
            line-height: 1.2;
        }

        /* SECOND LINE – "please try again later" */
        .line2 {
            font-size: clamp(1.2rem, 4vw, 2rem);
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #c0ffff;
            text-shadow: 
                0 0 8px #0ff,
                0 0 18px #0af,
                0 0 30px #06f;
            animation: softPulse 1.8s ease-in-out infinite alternate;
        }

        /* MAANGAS FLICKER EFFECT */
        @keyframes flickerGlow {
            0% {
                text-shadow: 
                    0 0 8px #0ff,
                    0 0 18px #0ff,
                    0 0 30px #0af,
                    0 0 60px #0af;
                opacity: 1;
            }
            20% {
                text-shadow: 
                    0 0 12px #0ff,
                    0 0 28px #0ff,
                    0 0 50px #0af,
                    0 0 90px #0af;
            }
            40% {
                text-shadow: 
                    0 0 6px #0ff,
                    0 0 14px #0ff,
                    0 0 25px #0af,
                    0 0 50px #0af;
                opacity: 0.95;
            }
            60% {
                text-shadow: 
                    0 0 15px #0ff,
                    0 0 35px #0ff,
                    0 0 60px #0af,
                    0 0 100px #0af;
            }
            80% {
                text-shadow: 
                    0 0 10px #0ff,
                    0 0 20px #0ff,
                    0 0 40px #0af,
                    0 0 80px #0af;
                opacity: 1;
            }
            100% {
                text-shadow: 
                    0 0 20px #0ff,
                    0 0 40px #0ff,
                    0 0 70px #0af,
                    0 0 120px #0af;
            }
        }

        @keyframes softPulse {
            0% {
                text-shadow: 
                    0 0 6px #0ff,
                    0 0 14px #0af,
                    0 0 24px #06f;
                opacity: 0.9;
                letter-spacing: 2px;
            }
            100% {
                text-shadow: 
                    0 0 12px #0ff,
                    0 0 26px #0af,
                    0 0 40px #06f;
                opacity: 1;
                letter-spacing: 4px;
            }
        }

        /* FLOATING ORBS (maangas background) */
        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #0ff, #06f);
            filter: blur(40px);
            opacity: 0.2;
            z-index: 2;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }

        .orb1 {
            width: 300px;
            height: 300px;
            top: -80px;
            left: -80px;
            animation-duration: 14s;
            background: radial-gradient(circle at 30% 30%, #0ff, #04a);
        }

        .orb2 {
            width: 400px;
            height: 400px;
            bottom: -120px;
            right: -100px;
            animation-duration: 18s;
            animation-delay: -3s;
            background: radial-gradient(circle at 70% 20%, #0af, #a0f);
        }

        .orb3 {
            width: 200px;
            height: 200px;
            top: 50%;
            left: 70%;
            animation-duration: 10s;
            animation-delay: -5s;
            background: radial-gradient(circle at 20% 60%, #0ff, #f0f);
            opacity: 0.15;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            50% {
                transform: translate(40px, -30px) scale(1.2);
            }
            100% {
                transform: translate(-30px, 40px) scale(0.9);
            }
        }

        /* NOISE / GLITCH OVERLAY */
        .glitch-layer {
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 255, 0.02) 0px,
                rgba(0, 255, 255, 0.02) 2px,
                transparent 2px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 20;
            mix-blend-mode: overlay;
        }

        /* SMALL BADGE / MAANGAS SIGNATURE */
        .badge {
            position: absolute;
            bottom: -18px;
            right: 40px;
            font-size: 0.7rem;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #0ff;
            background: #0a0e18;
            padding: 6px 18px;
            border-radius: 40px;
            border: 1px solid #0ff;
            box-shadow: 0 0 15px #0ff, inset 0 0 8px #0ff;
            opacity: 0.8;
            animation: badgeBlink 2.4s infinite;
            z-index: 15;
        }

        @keyframes badgeBlink {
            0%, 100% { opacity: 0.5; box-shadow: 0 0 8px #0ff; }
            50% { opacity: 1; box-shadow: 0 0 22px #0ff, 0 0 40px #0af; }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .card {
                padding: 2.5rem 1.8rem;
                border-radius: 24px;
                margin: 1rem;
            }
            .line1 {
                letter-spacing: 1px;
            }
            .line2 {
                letter-spacing: 1px;
            }
            .badge {
                bottom: -14px;
                right: 20px;
                font-size: 0.55rem;
                padding: 4px 12px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
    <!-- background layers -->
    <div class="bg-glow"></div>
    <div class="grid-overlay"></div>
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <!-- main card -->
    <div class="card">
        <div class="text-content">
            <div class="line1">i improving<br>this site</div>
            <div class="line2">please try again later</div>
        </div>
        <div class="badge">⚡ maangas mode</div>
    </div>

    <!-- extra glitch scanlines -->
    <div class="glitch-layer"></div>

    <script>
        // (optional) tiny extra glitch pulse for the card – pure maangas vibe
        (function() {
            const card = document.querySelector('.card');
            if (!card) return;

            // subtle random flicker on border / shadow (enhances the "maangas" feel)
            setInterval(() => {
                // only apply if not reduced motion
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

                const randomIntensity = 0.3 + Math.random() * 0.6;
                const randomBlur = 20 + Math.random() * 40;

                card.style.transition = 'box-shadow 0.12s, border-color 0.12s';
                card.style.boxShadow = `
                    0 0 ${randomBlur}px rgba(0, 255, 255, ${randomIntensity}),
                    0 0 ${randomBlur * 2}px rgba(0, 180, 255, ${randomIntensity * 0.7}),
                    inset 0 0 ${randomBlur * 0.6}px rgba(0, 255, 255, ${randomIntensity * 0.4})
                `;
                card.style.borderColor = `rgba(0, 255, 255, ${0.4 + Math.random() * 0.5})`;

                // reset after short time to let the css animation take over again
                setTimeout(() => {
                    card.style.boxShadow = '';
                    card.style.borderColor = '';
                    card.style.transition = '';
                }, 140);
            }, 1800);
        })();
    </script>
</body>
</html>
